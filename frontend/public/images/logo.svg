<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Forest Green Gradient -->
    <linearGradient id="leafGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3C7257" />
      <stop offset="100%" stop-color="#2E5A44" />
    </linearGradient>

    <!-- Walnut Brown Gradient -->
    <linearGradient id="vesselGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#734D35" />
      <stop offset="100%" stop-color="#5A3B28" />
    </linearGradient>
  </defs>

  <!-- Precision Outer Rings (Aesop / Nothing Inspired Minimalist Geometry) -->
  <circle cx="256" cy="256" r="236" stroke="#5A3B28" stroke-width="2" stroke-dasharray="6 8" fill="none" opacity="0.25" />
  <circle cx="256" cy="256" r="216" stroke="#2E5A44" stroke-width="2" fill="none" opacity="0.2" />

  <!-- Horizon Base Line -->
  <line x1="120" y1="368" x2="392" y2="368" stroke="#5A3B28" stroke-width="6" stroke-linecap="round" />

  <!-- Surabiy Vessel (Vessel of Abundance) -->
  <path d="M 140,350 C 140,430 372,430 372,350 Z" fill="url(#vesselGradient)" stroke="#5A3B28" stroke-width="6" stroke-linejoin="round" />

  <!-- Amudha Nectar & Organic Sprout Drop -->
  <path d="M 256,96 C 314,180 350,240 350,290 C 350,342 308,370 256,370 C 204,370 162,342 162,290 C 162,240 198,180 256,96 Z" fill="url(#leafGradient)" />

  <!-- Inner Negative Space Sprout Stem & Leaf Vein -->
  <path d="M 256,128 L 256,336" stroke="#FDFBF7" stroke-width="6" stroke-linecap="round" opacity="0.95" />
  <path d="M 256,224 C 284,204 308,214 314,236" stroke="#FDFBF7" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.9" />
  <path d="M 256,260 C 228,240 204,250 198,272" stroke="#FDFBF7" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.9" />

  <!-- Core Nectar Drop Accent -->
  <circle cx="256" cy="180" r="10" fill="#FDFBF7" />
</svg>
